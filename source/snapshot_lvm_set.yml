snapshot_lvm_set:
  name: snapset1
  bootable: true
  volumes:
    - name: snapshot VG1 LV1
      vg: test_vg1
      lv: lv1
      percent_space_required: 15
      mountpoint: /mnt/lv1_mp
    - name: snapshot VG2 LV3
      vg: test_vg2
      lv: lv3
      mountpoint: /mnt/lv3_mp
      percent_space_required: 15
    - name: snapshot VG2 LV4
      vg: test_vg2
      lv: lv4
      mountpoint: /mnt/lv4_mp
      percent_space_required: 15
    - name: snapshot VG3 LV7
      vg: test_vg3
      lv: lv7
      mountpoint: /mnt/lv7_mp
      percent_space_required: 15
